<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ariadne · 实验台账</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="#/"><i aria-hidden="true">§</i>Ariadne</a>
        <nav class="tabs" id="tabs" aria-label="主导航">
          <a class="tab" href="#/" data-tab="today">今天<b class="quiet" id="n-todo" hidden>0</b></a>
          <a class="tab" href="#/batches" data-tab="batches">批次<b class="quiet" id="n-batches" hidden>0</b></a>
          <a class="tab" href="#/ledger" data-tab="ledger">账本<b class="quiet" id="n-ledger" hidden>0</b></a>
          <a class="tab" href="#/paper" data-tab="paper">论文<b class="quiet" id="n-paper" hidden>0</b></a>
        </nav>
        <div class="top-acts">
          <button class="icon menu-btn" id="menu" aria-label="打开导航">≡</button>
          <button class="icon" id="open-palette" aria-label="搜索或跳转">⌘K</button>
          <button class="icon" id="theme" aria-label="切换深浅色">◐</button>
          <button class="icon" id="switch-project" hidden>⇄</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <p class="doc-line" id="doc-line"></p>
      <p class="loading" id="loading">正在读取实验记录…</p>

      <section id="view-today" class="view">
        <h1 class="page">今天</h1>
        <p class="page-sub" id="today-sub"></p>
        <div id="today-body"></div>
      </section>

      <section id="view-batches" class="view">
        <h1 class="page">批次</h1>
        <p class="page-sub">每一个批次是一次假设的检验。</p>
        <div id="batches-body"></div>
      </section>

      <section id="view-batch" class="view"><div id="batch-body"></div></section>

      <section id="view-new" class="view"><div id="new-body"></div></section>

      <section id="view-ledger" class="view">
        <h1 class="page">账本</h1>
        <p class="page-sub">上面是还没验证的念头，下面是验证之后留下的判断。两端都只进不删——被推翻的信念连同证伪它的那次实验，正是 discussion 里最有价值的段落。</p>
        <div id="ledger-body"></div>
      </section>

      <section id="view-paper" class="view">
        <h1 class="page">论文</h1>
        <p class="page-sub">实验结束时，材料已经在这里了。</p>
        <div id="paper-body"></div>
      </section>

      <section id="view-draft" class="view"><div id="draft-body"></div></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="palette-bg" class="palette-bg" hidden>
      <div class="palette" role="dialog" aria-label="搜索与跳转">
        <input id="palette-input" placeholder="搜索批次、想法、信念、草稿，或跳转页面…" autocomplete="off" />
        <div id="palette-list" class="palette-list" role="listbox"></div>
        <div class="palette-foot"><span>↑↓ 选择</span><span>↵ 跳转</span><span>esc 关闭</span></div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
